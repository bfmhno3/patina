[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["bfmhno3"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bfmhno3/patina"
publish = false

[workspace.dependencies]
patina-core = { path = "crates/patina-core" }
clap = { version = "4", features = ["derive"] }
slint = { version = "1.19", features = ["backend-android-activity-06"] }
slint-build = "1.19"
jiff = { version = "1.0.2", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.2"
anyhow = "1.0.105"
dirs = "7.0.0"
rmcp = { version = "3.11", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "io-std"] }
tempfile = "3.27.0"

[workspace.lints.rust]
rust_2018_idioms = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"
