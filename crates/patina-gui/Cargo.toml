[package]
name = "patina-gui"
description = "Slint + Material 3 GUI for Patina (desktop and Android)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "patina_gui"
crate-type = ["lib", "cdylib"] # cdylib is what Android loads

[[bin]]
name = "patina-gui"
path = "src/main.rs"

[dependencies]
slint.workspace = true

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

[package.metadata.android]
package = "io.github.bfmhno3.patina"
apk_name = "patina"

[package.metadata.android.sdk]
min_sdk_version = 26 # Slint Android backend minimum
target_sdk_version = 35

[package.metadata.android.application]
label = "Patina"
