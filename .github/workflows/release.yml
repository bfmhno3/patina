name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$tag" != "$crate" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $crate in Cargo.toml"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: write

  desktop:
    name: Build ${{ matrix.name }}
    needs: [version, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-aarch64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo build --release --locked -p patina-cli -p patina-mcp -p patina-gui --bins
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          dir="patina-${VERSION}-${NAME}"
          ext=""
          if [[ "$RUNNER_OS" == Windows ]]; then ext=".exe"; fi
          mkdir -p "dist/$dir"
          for bin in patina patina-mcp patina-gui; do
            cp "target/release/${bin}${ext}" "dist/$dir/"
          done
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$dir/"
          cd dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
          rm -rf "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Build android-aarch64
    needs: [version, ci]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for the Android SDK
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: cachix/install-nix-action@v32
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::error::set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets (see CONTRIBUTING.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build APK
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: nix develop .#android --command bash -c 'cd crates/patina-gui && cargo apk build --lib --release --target aarch64-linux-android'
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp target/release/apk/patina.apk "dist/patina-${VERSION}-android-aarch64.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-android-aarch64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Add download notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat >> RELEASE_NOTES.md <<EOF

          ### Downloads

          - Linux (glibc 2.39 or newer): \`patina-${VERSION}-linux-x86_64.tar.gz\`, \`patina-${VERSION}-linux-aarch64.tar.gz\`
          - Windows: \`patina-${VERSION}-windows-x86_64.zip\`
          - macOS on Apple Silicon: \`patina-${VERSION}-macos-aarch64.tar.gz\` (unsigned; after extracting run \`xattr -d com.apple.quarantine patina*\`)
          - Android 8.0 or newer, arm64: \`patina-${VERSION}-android-aarch64.apk\`

          Each archive holds \`patina\` (CLI), \`patina-mcp\` (MCP server), and \`patina-gui\`. Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: Patina ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
